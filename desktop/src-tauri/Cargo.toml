[package]
name = "velora-erp"
version = "1.5.0"
description = "Velora ERP — Desktop Application"
authors = ["Velora Systems"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
